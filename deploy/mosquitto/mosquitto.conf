# =============================================================================
# EdgeSentry - Mosquitto MQTT Broker config (LOCAL DEVELOPMENT)
# =============================================================================
# Minimal broker config for local dev. Listens on the standard MQTT port and
# allows connections 
# (A production config would add auth + 
# TLS; noted in the k8s deploy step later.)
# =============================================================================

# Listen for MQTT on the standard port, all interfaces inside the container.
listener 1883 0.0.0.0

# Allow clients to connect without a username/password.
# Broker is only reachable on localhost during development.
allow_anonymous true

# Write logs to stdout so docker logs shows broker activity.
log_dest stdout

# Log connections and subscriptions 
log_type all
